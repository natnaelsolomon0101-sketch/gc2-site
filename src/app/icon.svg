<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="GC2">
  <!-- The wordmark's own G, not a substitute for it.
       This path is the real DM Serif Display glyph, lifted out of the font
       binary Next already builds (units per em 1000, glyph bbox 20,-18 to
       641,678) and flipped into SVG's y-down space. Setting it as <text> in a
       named serif would have rendered whatever the viewer's OS had lying
       around, which is a different mark on every machine.
       Transform: font (x,y) -> (5.553 + 0.031609x, 26.431 - 0.031609y),
       which sits the cap height 5 units from the top of a 32 box and centres
       the glyph on the horizontal.

       Ink on paper, matching src/app/favicon.ico, icon.png, apple-icon.png and
       public/logo.png exactly: --color-ground behind --color-ink. It used to be
       the dark build's pale-iris on abyss, which made this the one icon that
       disagreed with the rest of the set — and "consistent across the site" is
       one of the things Google actually checks before it will show a site's own
       favicon instead of a globe. The glyph is unchanged; only the two fills
       are. Sizes 16 and 32 carry the G alone rather than the full GC2, for the
       reason written at the top of scripts/make-icons.ts: three glyphs across
       16 device pixels is a smudge. -->
  <rect width="32" height="32" fill="#f7f5f0"/>
  <path transform="translate(5.553 26.431) scale(0.031609 -0.031609)" fill="#141311"
        d="M364 -18Q262 -18 184.5 24.5Q107 67 63.5 145.5Q20 224 20 331Q20 435 63.0 513.0Q106 591 187.5 634.5Q269 678 385 678Q438 678 483.5 666.0Q529 654 570 631L574 491H564L508 595Q495 620 484.0 631.0Q473 642 456 648Q440 653 426.5 655.5Q413 658 391 658Q329 658 281.5 625.0Q234 592 208.0 520.0Q182 448 182 331Q182 215 206.5 142.0Q231 69 276.0 35.5Q321 2 380 2Q389 2 397.5 3.5Q406 5 414 7Q433 10 439.0 23.0Q445 36 445 54V252Q445 291 405 300L359 312V322H641V312L627 308Q589 296 589 258V41Q537 12 483.5 -3.0Q430 -18 364 -18Z"/>
</svg>
